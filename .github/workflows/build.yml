name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and run standard validation
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Run model geometry safety validation
        run: ./gradlew --no-daemon auditErydonModelGeometrySafety

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erydon-build-evidence
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn

