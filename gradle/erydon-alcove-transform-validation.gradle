// Exercise real BlockState entry points under Fabric, without a world or graphics window.
tasks.register('verifyAlcoveTransforms', JavaExec) {
    group = 'verification'
    description = 'Checks alcove flip/rotation composition and assembled cluster bounds.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    maxHeapSize = '1G'
    def fixture = layout.buildDirectory.dir('alcove-transform-probe')
    // Optional locally remapped Axiom and dependency JARs, separated by the OS path separator.
    def axiomMods = providers.gradleProperty('erydon.alcoveTestMods')
    doFirst {
        def root = fixture.get().asFile
        root.mkdirs()
        workingDir root
        def mod = new File(root, 'probe-mod')
        mod.mkdirs()
        new File(mod, 'fabric.mod.json').text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'erydon_alcove_transform_probe', version: '1.0.0',
                environment: 'client', entrypoints: [preLaunch: ['com.oliver.erydon.block.AlcoveTransformLaunchProbe']]
        ])
        systemProperty 'fabric.development', 'true'
        systemProperty 'fabric.addMods', mod.absolutePath + (axiomMods.isPresent()
                ? File.pathSeparator + axiomMods.get() : '')
        systemProperty 'erydon.alcove_test.axiom', axiomMods.isPresent()
        args '--gameDir', root.absolutePath, '--version', '1.20.1', '--accessToken', '0'
    }
}

tasks.named('check') { dependsOn tasks.named('verifyAlcoveTransforms') }
