tasks.register('verifyDiagonalWallRefresh', JavaExec) {
    group = 'verification'
    description = 'Differentially verifies the original and mutable diagonal-wall refresh algorithms.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.oliver.erydon.block.DiagonalWallRefreshAudit'
    args '--verify'
}

tasks.register('benchmarkDiagonalWallRefresh', JavaExec) {
    group = 'benchmark'
    description = 'Benchmarks original and mutable diagonal-wall refresh position handling.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.oliver.erydon.block.DiagonalWallRefreshAudit'
    maxHeapSize = '1G'

    doFirst {
        def outputFile = providers.gradleProperty('erydon.wallBenchmarkOutput')
                .map { file(it) }
                .getOrElse(layout.buildDirectory.file('benchmark-results/diagonal-wall-refresh.csv').get().asFile)
        def iterations = providers.gradleProperty('erydon.wallBenchmarkIterations').getOrElse('500000')
        def warmup = providers.gradleProperty('erydon.wallBenchmarkWarmup').getOrElse('100000')
        args = [
                '--benchmark',
                '--output', outputFile.absolutePath,
                '--iterations', iterations,
                '--warmup', warmup
        ]
    }
}

