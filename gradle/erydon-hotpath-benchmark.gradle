tasks.named('check') {
    dependsOn tasks.named('verifyDiagonalWallRefresh')
    dependsOn tasks.named('verifyFixedSlopeRotation')
    dependsOn tasks.named('verifyHorizontalUvLock')
    dependsOn tasks.named('verifyGothicArchCtmGeometry')
    dependsOn tasks.named('verifyModernArchCtmGeometry')
