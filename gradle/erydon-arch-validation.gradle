// Exercise real Minecraft states and cluster callbacks without a window or test JAR.
tasks.register('verifyWideArches', JavaExec) {
    group = 'verification'
    description = 'Checks arch widths 1-6, cluster reflow, transforms, collision and clipped component meshes.'
    dependsOn tasks.named('testClasses'), tasks.named('configureLaunch')
    def fixture = layout.buildDirectory.dir('wide-arch-probe')
    // Existing production optimizer JARs are remapped by Loader only for this probe.
    def testMods = providers.gradleProperty('erydon.arch.testMods')
    def foreignInitializer = providers.gradleProperty('erydon.arch.foreignInitializer')
            .map { it.toBoolean() }.getOrElse(false)
    classpath = sourceSets.test.runtimeClasspath + files(fixture.map { new File(it.asFile, 'probe-mod') })
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    maxHeapSize = '3G'
    if (providers.gradleProperty('erydon.arch.fullStartup').map { it.toBoolean() }.getOrElse(false)) {
        maxHeapSize = '8G'
        systemProperty 'erydon.arch.fullStartup', 'true'
    }
    doFirst {
        def root = fixture.get().asFile
        def mod = new File(root, 'probe-mod')
        mod.mkdirs()
        workingDir root
        def metadata = [
                schemaVersion: 1, id: 'erydon_wide_arch_probe', version: '1.0.0', environment: 'client',
                entrypoints: [preLaunch: ['com.oliver.erydon.block.WideArchLaunchProbe']]
        ]
        if (foreignInitializer) {
            metadata.mixins = ['arch-foreign-initializer.mixins.json']
            new File(mod, 'arch-foreign-initializer.mixins.json').text = groovy.json.JsonOutput.toJson([
                    required: true, minVersion: '0.8', compatibilityLevel: 'JAVA_17',
                    package: 'com.oliver.erydon.compat.state.mixin',
                    mixins: ['ForeignArchStateInitializerMixin'], injectors: [defaultRequire: 1]
            ])
        }
        new File(mod, 'fabric.mod.json').text = groovy.json.JsonOutput.toJson(metadata)
        systemProperty 'fabric.development', 'true'
        systemProperty 'erydon.arch.foreignInitializer', foreignInitializer
        if (testMods.isPresent()) {
            def mods = testMods.get().split(java.util.regex.Pattern.quote(File.pathSeparator))
                    .collect { file(it) }
            if (mods.any { !it.isFile() || !it.name.endsWith('.jar') }) {
                throw new GradleException('erydon.arch.testMods must name existing optimizer JARs')
            }
            systemProperty 'fabric.addMods', mods.collect { it.absolutePath }.join(File.pathSeparator)
            systemProperty 'fabric.remapClasspathFile', file('.gradle/loom-cache/remapClasspath.txt').absolutePath
        }
        args '--gameDir', root.absolutePath, '--version', '1.20.1', '--accessToken', '0'
    }
}
tasks.named('check') { dependsOn tasks.named('verifyWideArches') }
