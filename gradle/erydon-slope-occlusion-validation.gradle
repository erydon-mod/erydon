tasks.register('verifySlopeNeighbourOcclusion', JavaExec) {
    group = 'verification'
    description = 'Checks exact slope-neighbour exclusions with real states/layers, without opening a window or world.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    maxHeapSize = '2G'
    def fixture = layout.buildDirectory.dir('slope-occlusion-probe')
    doFirst {
        def root = fixture.get().asFile
        root.mkdirs()
        workingDir root
        def mod = new File(root, 'probe-mod')
        mod.mkdirs()
        new File(mod, 'fabric.mod.json').text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'erydon_slope_occlusion_probe', version: '1.0.0',
                environment: 'client', entrypoints: [preLaunch: ['com.oliver.erydon.client.model.SlopeNeighbourOcclusionLaunchProbe']]
        ])
        systemProperty 'fabric.development', 'true'
        systemProperty 'fabric.addMods', mod.absolutePath
        args '--gameDir', root.absolutePath, '--version', '1.20.1', '--accessToken', '0'
    }
}

tasks.named('check') { dependsOn tasks.named('verifySlopeNeighbourOcclusion') }
