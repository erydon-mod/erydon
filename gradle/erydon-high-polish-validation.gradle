tasks.register('verifyErydonOverlayPbr', Exec) {
    group = 'verification'
    description = 'Checks shared metal-overlay depth and retained bevel/specular maps.'
    workingDir project.projectDir
    inputs.files(file('tools/generate_overlay_pbr.py'), file('tools/tests/test_overlay_pbr.py'))
    inputs.dir(file('src/main/resources/assets/minecraft/textures/optifine/ctm/overlay'))
    commandLine providers.gradleProperty('erydon.pythonExecutable').getOrElse('python'),
            '-m', 'unittest', 'tools.tests.test_overlay_pbr', '-v'
}
tasks.named('check') { dependsOn tasks.named('verifyErydonOverlayPbr') }

// Optional local shader audits must rerun when switching the inspected ZIP.
tasks.named('test', Test) {
    ['ERYDON_CU_TEST_SHADER', 'ERYDON_BLISS_TEST_SHADER'].each { variable ->
        def shader = providers.environmentVariable(variable)
        inputs.property(variable, shader.isPresent())
        if (shader.isPresent()) {
            inputs.file(shader).withPropertyName(variable + '_source').withPathSensitivity(PathSensitivity.NONE)
        }
    }
    def shaderDirectory = providers.environmentVariable('ERYDON_CU_TEST_SHADER_DIR')
    inputs.property('ERYDON_CU_TEST_SHADER_DIR', shaderDirectory.isPresent())
    if (shaderDirectory.isPresent()) {
        inputs.files(fileTree(shaderDirectory.get()) { include 'Complementary*.zip' })
                .withPropertyName('ERYDON_CU_TEST_SHADER_DIR_sources').withPathSensitivity(PathSensitivity.NONE)
    }
    inputs.property('ERYDON_CU_GL_VALIDATE', providers.environmentVariable('ERYDON_CU_GL_VALIDATE').getOrElse('false'))
    // Real shader matrices retain considerably more compiler data than ordinary unit fixtures.
    if (providers.environmentVariable('ERYDON_CU_TEST_SHADER').isPresent() || shaderDirectory.isPresent()
            || providers.environmentVariable('ERYDON_CU_GL_VALIDATE').map { it in ['true', '1'] }.getOrElse(false)) {
        maxHeapSize = '2G'
    }
}

// Isolated, pre-launch-only test. No world, graphics window or test JAR is created.
tasks.register('verifyHighPolishMixinLaunch', JavaExec) {
    group = 'verification'
    description = 'Applies high-polish mixins through Fabric and verifies actual Iris startup ordering.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
    maxHeapSize = '1G'
    def fixture = layout.buildDirectory.dir('high-polish-mixin-probe')
    doFirst {
        def root = fixture.get().asFile
        root.mkdirs()
        workingDir root
        def mod = new File(root, 'probe-mod')
        mod.mkdirs()
        new File(mod, 'fabric.mod.json').text = groovy.json.JsonOutput.toJson([
                schemaVersion: 1, id: 'erydon_high_polish_probe', version: '1.0.0',
                environment: 'client', entrypoints: [preLaunch: ['com.oliver.erydon.client.pom.HighPolishMixinLaunchProbe']]
        ])
        def config = new File(root, 'config')
        config.mkdirs()
        new File(config, 'erydon-client.properties').text = 'erydon.high_polish.enabled=true\n'
        systemProperty 'fabric.development', 'true'
        systemProperty 'fabric.addMods', mod.absolutePath
        systemProperty 'mixin.debug.export', 'true'
        systemProperty 'mixin.debug.export.filter', 'net.irisshaders.iris.shaderpack.**'
        args '--gameDir', root.absolutePath, '--version', '1.20.1', '--accessToken', '0'
    }
}
